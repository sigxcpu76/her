[package]
name = "her-sip"
version = "0.1.0"
edition = "2021"
description = "Lightweight cross-platform SIP phone in Rust + Slint with STUN/NAT traversal, optional registration, and keyboard-to-DTMF"

[dependencies]
slint = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
cpal = "0.15"
oxideav-g722 = "0.0.7"
oxideav-g711 = "0.0.8"
oxideav-g729 = "0.0.8"
md5 = "0.7"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[build-dependencies]
slint-build = "1"
